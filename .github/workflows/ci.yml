name: CI

# Phase 1 of docs/REPO_RESTRUCTURING_PLAN.md, updated 2026-09-16 for the
# Phase 4 monorepo merge (docs/PHASE4_ARCHITECTURE_SCOPING.md): the AP
# world's full history now lives under apworld/ in this same repo, via
# `git subtree add`. Every job that used to check out a second repo
# (bropacman/shadow-man-remastered-ap-world) now just reads apworld/
# from the same checkout -- simpler, and there's nothing left to get
# out of sync between "which commit of this repo" and "which commit of
# that repo" the way there was before.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  compile-check:
    name: Compile-check every tracked .py file
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every tracked Python file
        shell: bash
        run: |
          set -e
          # git ls-files (not a recursive glob) so this only ever checks
          # what's actually committed -- matches what a fresh clone gets,
          # not whatever happens to be sitting in this runner's working
          # copy. Naturally includes apworld/**/*.py now too, no separate
          # step needed.
          git ls-files '*.py' > /tmp/py_files.txt
          wc -l /tmp/py_files.txt
          python -m py_compile $(cat /tmp/py_files.txt)

  apworld-drift-check:
    name: Drift check between root and apworld/ shared files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tools/check_apworld_sync.py still has real value post-merge: the
      # ~10 "expected-divergent" files (access_rules.py, fill.py,
      # regions.py, etc.) are STILL two genuinely separate implementations
      # by design (see PHASE4_ARCHITECTURE_SCOPING.md's correction on
      # this -- AP's concurrency model needs BoundR-style per-world state
      # the standalone's simple globals can't provide), and the
      # ~11 "near-identical" files haven't been de-duplicated yet either
      # (that's Phase 4b, not done in this pass). DEFAULT_AP_DIR now
      # points at the local apworld/ subfolder instead of a sibling
      # checkout -- one repo, one clone, same comparison.
      - name: Run the drift checker
        shell: bash
        run: |
          set -e
          PYTHONIOENCODING=utf-8 python tools/check_apworld_sync.py --ap-dir apworld

  dll-rebuild-check:
    name: Rebuild overlay DLL and diff against the committed apworld/ binary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest already ships MSVC + CMake, no extra setup needed.
      # NOTE: CMakeLists.txt's FetchContent pulls minhook/imgui at
      # GIT_TAG master (not pinned) -- same as local dev builds today.
      # First version of this job tried a hard byte-for-byte diff against
      # the committed binary and it failed on its very first real run even
      # though the build was completely correct: built 821248B vs committed
      # 819712B, a ~1.5KB difference from nothing more than the runner's
      # MSVC/dependency versions not being pixel-identical to Jon's local
      # machine. A byte-exact target is fundamentally the wrong bar for an
      # unpinned, multi-environment build -- so this job instead directly
      # tests the actual property that matters (see CMakeLists.txt's own
      # 2026-08-15 comment: the whole point of static-linking is that the
      # DLL must never need vcruntime140.dll/msvcp140.dll on the target
      # machine), plus a generous size sanity bound that would have caught
      # this session's real bug (a stale committed Debug build, ~2.8MB,
      # dynamic CRT) immediately. The byte-diff is kept as a non-blocking,
      # informational step below.
      - name: Configure (x64)
        working-directory: overlay_dll
        run: cmake -B build -A x64

      - name: Build (Release)
        working-directory: overlay_dll
        run: cmake --build build --config Release

      - name: Verify the DLL is a statically-linked Release build
        shell: bash
        run: |
          set -e
          built="overlay_dll/build/Release/ShadowManOverlay.dll"
          size=$(stat -c%s "$built")
          echo "Built DLL size: $size bytes"
          # A dynamic-CRT Debug build (the exact bug this job exists to
          # catch) is ~2.8MB; a correctly statically-linked Release build
          # is currently ~800-850KB. Generous bound, not a tight one --
          # toolchain drift over time is expected, a huge jump isn't.
          if [ "$size" -gt 1500000 ]; then
            echo "::error::Built DLL is $size bytes -- too large for a static-CRT Release build (expected roughly 500KB-1.5MB). Check CMAKE_MSVC_RUNTIME_LIBRARY and the build config actually used."
            exit 1
          fi
          # Verified locally against real Debug/Release builds before
          # trusting this pattern: Release contains none of these strings;
          # Debug contains VCRUNTIME140D.dll/MSVCP140D.dll/VCRUNTIME140_1D.dll.
          # Matches case-insensitively and covers both the debug ("D"
          # suffix) and plain dynamic-linkage ("VCRUNTIME140.dll" with no
          # "D") name forms.
          if grep -aiE "VCRUNTIME140D?(_1D?)?\.dll|MSVCP140D?\.dll" "$built" > /dev/null; then
            echo "::error::Built DLL references the MSVC runtime DLLs (vcruntime140/msvcp140) -- CRT is dynamically linked, not static. Players without the VC++ redistributable installed would fail to load this overlay."
            exit 1
          fi
          echo "DLL is a correctly statically-linked Release build."

      - name: Compare against the committed apworld/ binary (informational only)
        shell: bash
        run: |
          built="overlay_dll/build/Release/ShadowManOverlay.dll"
          committed="apworld/ShadowManOverlay.dll"
          ls -la "$built" "$committed"
          if cmp -s "$built" "$committed"; then
            echo "Rebuilt DLL matches the committed binary byte-for-byte."
          else
            echo "::warning::Rebuilt DLL differs from the committed binary in apworld/ (built=$(stat -c%s "$built")B, committed=$(stat -c%s "$committed")B). Not failing the build for this alone -- unpinned FetchContent deps and toolchain differences between this runner and a local dev machine are expected to cause small differences. If you actually changed overlay_dll/src and expected the shipped DLL to update, rebuild locally and re-commit it under apworld/ -- this step won't catch that for you."
          fi

  shadowman-world-tests:
    name: Shadow Man world tests (against a real Archipelago core checkout)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the exact tag this world targets (confirmed via
      # `gh api repos/ArchipelagoMW/Archipelago/tags` -- "0.6.7" exists
      # verbatim, not "v0.6.7"), not `main`/`master` -- this world's own
      # code was written and tested against 0.6.7's actual BaseClasses/
      # Fill/Options APIs, which do shift between AP releases. Bump this
      # deliberately (and re-verify) if the world is ever updated to
      # target a newer Archipelago version, don't let it silently float.
      - name: Check out Archipelago core
        uses: actions/checkout@v4
        with:
          repository: ArchipelagoMW/Archipelago
          ref: "0.6.7"
          path: archipelago

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Drop this world's source into the Archipelago checkout
        shell: bash
        run: |
          set -e
          rm -rf archipelago/worlds/shadowman
          cp -r apworld archipelago/worlds/shadowman

      # Mirrors ArchipelagoMW/Archipelago's own .github/workflows/
      # unittests.yml install sequence (ci-requirements.txt, then
      # ModuleUpdate.py) -- proven working there, not guessed at here.
      - name: Install Archipelago's test dependencies
        working-directory: archipelago
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          # Deliberately NOT running `python Launcher.py --update_settings`
          # (part of upstream's own recipe, there to create host.yaml
          # before their FULL test suite runs). This job only ever runs
          # worlds/shadowman/test/__init__.py -- confirmed it has no
          # reference to host.yaml/Utils.get_settings anywhere in its own
          # code or in test.bases/test.general. First real run hit a
          # genuine, unrelated flake here: ModuleUpdate.py also runs
          # internally inside Launcher.py's own startup, found a real
          # version conflict between two completely unrelated bundled
          # worlds' requirements.txt files (zilliandomizer's dependency
          # pulling a newer typing_extensions than another world pins),
          # and tried to prompt interactively to confirm the fix -- which
          # raises a bare EOFError with no stdin attached in CI. Dropping
          # this unneeded step sidesteps that whole dependency-conflict
          # surface for this narrow test scope entirely.

      # Run the FILE directly, not the bare `test/` directory -- see
      # apworld/test/__init__.py's own docstring: this AP version's
      # pytest.ini python_files glob doesn't actually match this path on
      # this Python version (confirmed locally), so the directory form
      # silently collects 0 items with no error at all.
      - name: Run this world's own test suite
        working-directory: archipelago
        shell: bash
        run: |
          set -e
          python -m pytest worlds/shadowman/test/__init__.py -v
