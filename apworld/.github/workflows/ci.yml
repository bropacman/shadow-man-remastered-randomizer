name: CI

# Phase 1 of shadow-man-remastered-randomizer's docs/REPO_RESTRUCTURING_PLAN.md
# -- deliberately minimal to start (compile-check only), matching the
# same step added to the standalone repo. py_compile only checks syntax,
# not imports, so this file's relative imports (`from .constants import
# ...`) and its dependency on Archipelago's own `BaseClasses` (not
# installed here) are both fine -- nothing actually executes.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  compile-check:
    name: Compile-check every tracked .py file
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile every tracked Python file
        shell: bash
        run: |
          set -e
          git ls-files '*.py' > /tmp/py_files.txt
          wc -l /tmp/py_files.txt
          python -m py_compile $(cat /tmp/py_files.txt)
